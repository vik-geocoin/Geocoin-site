let currentLang = 'ru';
let currentFilter = null;

function setLang(lang) {
  currentLang = lang;
  render();
}

function setFilter(cat) {
  currentFilter = cat === currentFilter ? null : cat;
  render();
}

function render() {
  const filtersDiv = document.getElementById('filters');
  const cardsDiv = document.getElementById('cards');
  const cats = [...new Set(coins.map(c => c.category))];
  filtersDiv.innerHTML = '';
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.textContent = cat;
    if (cat === currentFilter) btn.classList.add('active');
    btn.onclick = () => setFilter(cat);
    filtersDiv.appendChild(btn);
  });
  cardsDiv.innerHTML = '';
  const list = currentFilter ? coins.filter(c => c.category === currentFilter) : coins;
  list.forEach(coin => {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <img src="${coin.img}" alt="${coin.title[currentLang]}">
      <h3>${coin.title[currentLang]}</h3>
      <p>${coin.desc[currentLang]}</p>
    `;
    cardsDiv.appendChild(div);
  });
}

render();

// карта
const map = L.map('mapid').setView([41.7151, 44.8271], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: 'Map data © <a href="https://openstreetmap.org">OpenStreetMap</a> contributors'
}).addTo(map);
[

  { city: 'Мцхета — Светицховели', lat: 41.84, lng: 44.72 },
  { city: 'Батуми — Площадь Европы', lat: 41.65, lng: 41.64 },
  { city: 'Телави — Епископский дворец', lat: 41.92, lng: 45.47 }
].forEach(p => {
  L.marker([p.lat, p.lng]).addTo(map).bindPopup(p.city);
});
